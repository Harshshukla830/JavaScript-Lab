
<!DOCTYPE html>
<html>
<head>
    <title>Inheritance and Methods</title>
</head>
<body>

    <h1>Inheritance, Methods and Composition</h1>

    <script>

        // Parent Class
        class Animal {
            constructor(name) {
                this.name = name;
            }

            eat() {
                console.log(this.name + " is eating");
            }

            sound() {
                console.log("Animal makes a sound");
            }
        }

        // Child Class
        class Dog extends Animal {
            constructor(name, breed) {
                super(name);
                this.breed = breed;
            }

            bark() {
                console.log(this.name + " is barking");
            }

            sound() {
                console.log("Dog barks");
            }
        }

        let dog1 = new Dog("Tommy", "German Shepherd");

        dog1.eat();
        dog1.bark();
        dog1.sound();

        console.log("Breed:", dog1.breed);

        // Method Example
        class Calculator {
            add(a, b) {
                return a + b;
            }

            subtract(a, b) {
                return a - b;
            }

            multiply(a, b) {
                return a * b;
            }
        }

        let calc = new Calculator();

        console.log("Addition:", calc.add(10, 5));
        console.log("Subtraction:", calc.subtract(10, 5));
        console.log("Multiplication:", calc.multiply(10, 5));

    </script>

</body>
</html>
