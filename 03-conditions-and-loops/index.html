
<!DOCTYPE html>
<html>
<head>
    <title>Conditions and Loops</title>
</head>
<body>

    <h1>Conditions and Loops</h1>

    <script>
        // If-Else
        let age = 18;

        if (age >= 18) {
            console.log("You are eligible");
        } else {
            console.log("You are not eligible");
        }

        // For Loop
        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }

        // While Loop
        let num = 1;

        while (num <= 5) {
            console.log("Number:", num);
            num++;
        }

        // Switch
        let day = 2;

        switch (day) {
            case 1:
                console.log("Monday");
                break;
            case 2:
                console.log("Tuesday");
                break;
            default:
                console.log("Invalid Day");
        }
    </script>

</body>
</html>
