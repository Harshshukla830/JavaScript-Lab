
<!DOCTYPE html>
<html>
<head>
    <title>Reduce, Some, Every and Map</title>
</head>
<body>

    <h1>Reduce, Some, Every and Map</h1>

    <script>

        // Original Array
        let numbers = [1, 2, 3, 4, 5];

        console.log("Original Array:", numbers);

        // 1. Map Method
        let doubled = numbers.map(function(num) {
            return num * 2;
        });

        console.log("Map Result:", doubled);

        // 2. Reduce Method
        let sum = numbers.reduce(function(total, num) {
            return total + num;
        }, 0);

        console.log("Reduce Sum:", sum);

        // 3. Some Method
        let hasEven = numbers.some(function(num) {
            return num % 2 === 0;
        });

        console.log("Some Result:", hasEven);

        // 4. Every Method
        let allPositive = numbers.every(function(num) {
            return num > 0;
        });

        console.log("Every Result:", allPositive);

        // 5. Filter Method
        let evenNumbers = numbers.filter(function(num) {
            return num % 2 === 0;
        });

        console.log("Filter Result:", evenNumbers);

        // 6. Find Method
        let found = numbers.find(function(num) {
            return num > 3;
        });

        console.log("Find Result:", found);

    </script>

</body>
</html>
